name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ABI APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub 的 ubuntu-24.04 镜像预装 Android SDK（Platform 35 / Build-Tools 35.0.0），
      # 因此不再依赖 android-actions/setup-android，避免第三方 action 启动失败。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"

      - name: Build ABI APKs and run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testX86DebugUnitTest :app:assembleX86Debug :app:assembleArm64Debug

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/x86/debug/app-x86-debug.apk RootTunClash-x86_64-pre.apk
          cp app/build/outputs/apk/arm64/debug/app-arm64-debug.apk RootTunClash-arm64-v8a-pre.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RootTunClash-pre
          path: |
            RootTunClash-x86_64-pre.apk
            RootTunClash-arm64-v8a-pre.apk
          if-no-files-found: error

  release:
    name: Publish pre tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v8
        with:
          name: RootTunClash-pre
          path: .

      - name: Remove old universal asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset pre RootTunClash-pre.apk --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Update pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pre
          name: Development pre-release
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            RootTunClash-x86_64-pre.apk
            RootTunClash-arm64-v8a-pre.apk
          body: |
            > [!WARNING]
            > 开发阶段自动构建，功能与稳定性可能变化；APK 使用 debug 签名，仅供测试。
            > 请安装与设备 ABI 匹配的 APK，两个包使用同一包名，不能同时安装。

            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - `x86_64`: `RootTunClash-x86_64-pre.apk`
            - `arm64-v8a`: `RootTunClash-arm64-v8a-pre.apk`
