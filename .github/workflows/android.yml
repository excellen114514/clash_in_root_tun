name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub 的 ubuntu-24.04 镜像预装 Android SDK（Platform 35 / Build-Tools 35.0.0），
      # 因此不再依赖 android-actions/setup-android，避免第三方 action 启动失败。
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME}/platforms/android-35"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"

      - name: Build and run JVM tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk RootTunClash-pre.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RootTunClash-pre
          path: RootTunClash-pre.apk
          if-no-files-found: error

  release:
    name: Publish pre tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: RootTunClash-pre
          path: .

      - name: Update pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pre
          name: Development pre-release
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: RootTunClash-pre.apk
          body: |
            > [!WARNING]
            > 开发阶段自动构建，功能与稳定性可能变化；APK 使用 debug 签名，仅供测试。

            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 产物: `RootTunClash-pre.apk`
