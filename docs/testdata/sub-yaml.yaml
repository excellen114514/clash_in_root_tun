port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
proxies:
  - name: "测试节点-香港 01"
    type: ss
    server: 127.0.0.1
    port: 18388
    cipher: aes-128-gcm
    password: "test-password"
    udp: true
  - name: "测试节点-日本 02"
    type: ss
    server: 127.0.0.1
    port: 18389
    cipher: aes-256-gcm
    password: "test-password-2"
    udp: true
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "测试节点-香港 01"
      - "测试节点-日本 02"
      - DIRECT
rules:
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
